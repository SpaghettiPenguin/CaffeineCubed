# Mod metadata read by NeoForge. The placeholder values are filled in from gradle.properties at build time.
# Field reference: https://docs.neoforged.net/docs/gettingstarted/modfiles#neoforgemodstoml

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

# Where to report problems with this mod
issueTrackerURL="https://github.com/SpaghettiPenguin/CaffeineCubed/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory

# The mod's homepage, shown in the mods list
displayURL="https://github.com/SpaghettiPenguin/CaffeineCubed"

# The logo shown in the mods list (in the root of the jar), kept sharp rather than blurred since it's pixel art
logoFile="caffeinecubed.png"
logoBlur=false

authors="SpaghettiPenguin"

credits="Coffee Machine brewing sound: a modified version of \"Coffee machine (SoundAction 024)\" by alexarje (freesound.org/s/721706), CC BY 4.0"

description='''
A mod for Minecraft focused on growing, grinding, and brewing coffee.

Find raw coffee beans in the jungle and grow coffee bushes, whose beans take their quality from the biome they grow in. Roast them in the Coffee Roaster, grind them with the Coffee Grinder, and brew Coffee or Ice Coffee in the Coffee Machine, adding a Grinder Attachment, Milk Frother and Syrup Compactor to make it do more. The Triple Axis Siphon makes Rainbow Blend and the legendary God's Coffee.

Every cup's effects depend on its beans' quality and roast. Craft a book with a raw coffee bean for the guide that explains it all.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The guide book is a Patchouli book
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="required"
    versionRange="[1.21.1-93,)"
    ordering="NONE"
    side="BOTH"
